name: Qualité et sécurité

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Vérifier tous les fichiers
        run: |
          mkdir -p preuves
          set -o pipefail
          python -m pre_commit run --all-files | tee preuves/controles-ci.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preuves-precommit
          path: preuves/
